services:
  - type: web
    name: rya-fruit-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_COOKIE_NAME
        value: rya_admin_session
      - key: ADMIN_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PUBLIC_UPLOAD_BASE
        sync: false
